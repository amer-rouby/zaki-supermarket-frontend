<mat-card class="refund-form-card">
  <mat-card-header>
    <mat-card-title>{{'REFUND.TITLE' | translate}}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="refundForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{'REFUND.AMOUNT' | translate}}</mat-label>
        <input matInput type="number" formControlName="amount" step="0.01" min="0.01" [max]="maxAmount">
        <mat-icon matPrefix>attach_money</mat-icon>
        <mat-hint>{{'REFUND.MAX_AMOUNT' | translate}}: {{maxAmount | number:'1.2-2'}} ج.م</mat-hint>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{'REFUND.REASON' | translate}}</mat-label>
        <textarea matInput formControlName="reason" rows="3"></textarea>
      </mat-form-field>
      <div class="actions">
        <button mat-button type="button" (click)="onCancel()">{{'COMMON.CANCEL' | translate}}</button>
        <button mat-raised-button color="warn" type="submit" [disabled]="loading()">
          @if (loading()) {
          <mat-spinner diameter="20"></mat-spinner>
          } @else {
          <ng-container>
            <mat-icon>refund</mat-icon>
            <span>{{'REFUND.SUBMIT' | translate}}</span>
          </ng-container>
          }
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
