<table mat-table [dataSource]="products" class="data-table">
  <ng-container matColumnDef="rank">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let row; let i = index">
      <span class="rank-badge">{{ rankFor(row, i) }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="productName">
    <th mat-header-cell *matHeaderCellDef>{{ 'PRODUCTS.NAME' | translate }}</th>
    <td mat-cell *matCellDef="let row">
      <span class="product-name">{{ row.productName }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="quantitySold">
    <th mat-header-cell *matHeaderCellDef>{{ 'SALES.QUANTITY' | translate }}</th>
    <td mat-cell *matCellDef="let row">
      @if (useChips) {
        <mat-chip class="small-chip">{{ row.quantitySold }}</mat-chip>
      } @else {
        <span class="quantity">{{ row.quantitySold }}</span>
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="totalRevenue">
    <th mat-header-cell *matHeaderCellDef>{{ 'SALES.TOTAL_PRICE' | translate }}</th>
    <td mat-cell *matCellDef="let row">
      <span class="revenue">{{ formatMoney(row.totalRevenue) }}</span>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
